name: Apply CHD contract fix
on:
  push:
    branches:
      - fix/chd-data-contract-v34
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix CHD build_data frontend contract') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply contract patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chd_master_predictor.py')
          s = p.read_text()
          old = '''    return {\n        "mlb":mlb_games,\n        "nfl":nfl_games,\n        "nba":nba_games,'''
          if old not in s:
              raise SystemExit('expected build_data return contract not found')
          new = '''    return {\n        "mlb": {"runDate": datetime.now(ET_ZONE).strftime("%b %d %Y %I:%M %p"), "pickCount": len(mlb_games), "games": mlb_games, "chd_meta": {"model": summary["model"], "calibration": WAVE_SPORTS_CONFIG['MLB']['calibration']}},\n        "nfl": {"runDate": datetime.now(ET_ZONE).strftime("%b %d %Y %I:%M %p"), "pickCount": len(nfl_games), "games": nfl_games, "chd_meta": {"model": "CHD v3.4 NFL EPA/DVOA nflverse", "calibration": WAVE_SPORTS_CONFIG['NFL']['calibration']}},\n        "nba": {"runDate": datetime.now(ET_ZONE).strftime("%b %d %Y %I:%M %p"), "pickCount": len(nba_games), "games": nba_games, "chd_meta": {"model": "CHD v3.4 NBA OffRtg/DefRtg NBA Stats API", "calibration": WAVE_SPORTS_CONFIG['NBA']['calibration']}},'''
          s = s.replace(old, new, 1)
          if '"mlb_data":' not in s:
              raise SystemExit('mlb_data compatibility alias missing')
          p.write_text(s)
          PY
          python -m py_compile chd_master_predictor.py
      - name: Commit patched predictor
        run: |
          git config user.name "CHD Contract Fix"
          git config user.email "chd@parlayos.com"
          git add chd_master_predictor.py
          if git diff --cached --quiet; then
            echo "No source change created"
            exit 1
          fi
          git commit -m "Fix CHD build_data frontend contract"
          git push origin HEAD:fix/chd-data-contract-v34
