name: CHD Daily Build
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * *' # 9am ET daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-main-writers
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch full MLB rosters (30 teams)
        env:
          ALLOW_DEMO_SLATE: 0
          ALLOW_MOCK_STATS: 0
        run: |
          python chd_master_predictor.py --fetch-rosters

      - name: Build CHD data
        env:
          ALLOW_DEMO_SLATE: 0
          ALLOW_MOCK_STATS: 0
          CHD_MODE: ensemble
          CHD_WEATHER_ENABLED: 1
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python chd_master_predictor.py --date $(date +%Y-%m-%d)

      - name: Validate generated CHD outputs
        run: |
          set -e
          test -s parlayos_chd_data.json
          test -s parlayos_mlb_chd.json
          test -s parlayos_nfl_chd.json
          test -s parlayos_nba_chd.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              'parlayos_chd_data.json',
              'parlayos_mlb_chd.json',
              'parlayos_nfl_chd.json',
              'parlayos_nba_chd.json',
          ]:
              p = Path(name)
              data = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{name} is not a JSON object')
              game_count = len(data.get("games", [])) if "games" in data else sum(len(v.get("games", [])) for v in data.values() if isinstance(v, dict))
              print(f'OK {name}: {game_count} games')
          PY

      - name: Validate model
        run: |
          python chd_master_predictor.py --validate
          python chd_master_predictor.py --ab-test-report

      - name: Run self-tests
        run: |
          python chd_master_predictor.py --test

      - name: Build and publish HTML from generated CHD JSON
        run: |
          set -e
          test -f run_all.py
          test -s parlayos.html || test -s index.html
          python run_all.py
          test -s parlayos.html
          test -s index.html
          cmp -s parlayos.html index.html
          echo "CHD JSON dashboard publish validation passed: $(wc -c < parlayos.html) bytes"

      - name: Validate dashboard contains runtime CHD loader only
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ["parlayos.html", "index.html"]:
              html=Path(name).read_text(encoding="utf-8")
              if 'loadParlayOSCHDData' not in html or 'parlayos_mlb_chd.json' not in html or 'parlayos_nfl_chd.json' not in html or 'parlayos_nba_chd.json' not in html:
                  raise SystemExit(f"{name}: runtime CHD loader missing")
              forbidden = [
                  r'window\.PARLAYOS_DATA\s*=\s*\{\s*["\']runDate["\']',
                  r'window\.PARLAYOS_NFL_DATA\s*=\s*\{\s*["\']runDate["\']',
                  r'window\.PARLAYOS_NBA_DATA\s*=\s*\{\s*["\']runDate["\']',
                  r'window\.PARLAYOS_LIVE_SCORES\s*=\s*\{',
                  r'window\.LIVE_SCORES_DATA\s*=\s*\{',
                  r'window\.PARLAYOS_SPORTS_CONFIG\s*=\s*\{',
              ]
              for pattern in forbidden:
                  if re.search(pattern, html, re.S):
                      raise SystemExit(f"{name}: embedded generated data detected: {pattern}")
              if '16b0a233c6bbe7492dc168a1a46ec469' in html:
                  raise SystemExit(f"{name}: browser-exposed API key detected")
          if Path("parlayos.html").read_bytes() != Path("index.html").read_bytes():
              raise SystemExit("parlayos.html and index.html differ")
          print("Runtime CHD loader validation passed")
          PY

      - name: Publish CHD dashboard + JSON to public repo
        env:
          PUBLIC_REPO_NAME: ${{ secrets.PUBLIC_REPO_NAME }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          test -n "$PUBLIC_REPO_NAME"
          test -n "$PUBLIC_REPO_TOKEN"
          git clone --depth 1 "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO_NAME}.git" public-repo
          cp -f index.html public-repo/index.html
          cp -f parlayos.html public-repo/parlayos.html
          cp -f parlayos_chd_data.json public-repo/parlayos_chd_data.json
          cp -f parlayos_mlb_chd.json public-repo/parlayos_mlb_chd.json
          cp -f parlayos_nfl_chd.json public-repo/parlayos_nfl_chd.json
          cp -f parlayos_nba_chd.json public-repo/parlayos_nba_chd.json
          cp -f live_scores.json public-repo/live_scores.json 2>/dev/null || true
          cp -f .nojekyll public-repo/.nojekyll 2>/dev/null || touch public-repo/.nojekyll
          if ls public-repo/*.py 1>/dev/null 2>&1; then echo "ERROR: Python leaked to public repo"; exit 1; fi
          cd public-repo
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html parlayos.html parlayos_*.json live_scores.json .nojekyll
          if git diff --staged --quiet; then
            echo "No public changes"
            exit 0
          fi
          git commit -m "deploy: CHD runtime dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main

      - name: Commit generated outputs
        run: |
          git config user.name "CHD Bot"
          git config user.email "chd@parlayos.com"
          git add parlayos_*.json chd.log mlb_rosters_cache.json parlayos.html index.html run_all.py live_scores.py .github/workflows/chd_daily.yml || true
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "CHD daily build $(date +%Y-%m-%d)"
          git push origin HEAD:main

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chd-outputs
          path: |
            parlayos_*.json
            parlayos.html
            index.html
            chd.log
            mlb_rosters_cache.json
