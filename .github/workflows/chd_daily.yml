name: CHD Daily Build
on:
  schedule:
    - cron: '0 13 * * *' # 9am ET daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch full MLB rosters (30 teams)
        env:
          ALLOW_DEMO_SLATE: 0
          ALLOW_MOCK_STATS: 0
        run: |
          python chd_master_predictor.py --fetch-rosters

      - name: Build CHD data
        env:
          ALLOW_DEMO_SLATE: 0
          ALLOW_MOCK_STATS: 0
          CHD_MODE: ensemble
          CHD_WEATHER_ENABLED: 1
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python chd_master_predictor.py --date $(date +%Y-%m-%d)

      - name: Validate generated CHD outputs
        run: |
          set -e
          test -s parlayos_chd_data.json
          test -s parlayos_mlb_chd.json
          test -s parlayos_nfl_chd.json
          test -s parlayos_nba_chd.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              'parlayos_chd_data.json',
              'parlayos_mlb_chd.json',
              'parlayos_nfl_chd.json',
              'parlayos_nba_chd.json',
          ]:
              p = Path(name)
              data = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{name} is not a JSON object')
              print(f'OK {name}: {len(data.get("games", []))} games')
          PY

      - name: Validate model
        run: |
          python chd_master_predictor.py --validate
          python chd_master_predictor.py --ab-test-report

      - name: Run self-tests
        run: |
          python chd_master_predictor.py --test

      - name: Build and publish HTML from generated CHD JSON
        run: |
          set -e
          test -f run_all.py
          test -s parlayos.html || test -s index.html
          python run_all.py
          test -s parlayos.html
          test -s index.html
          cmp -s parlayos.html index.html
          echo "CHD JSON dashboard publish validation passed: $(wc -c < parlayos.html) bytes"

      - name: Commit generated outputs
        run: |
          git config user.name "CHD Bot"
          git config user.email "chd@parlayos.com"
          git add parlayos_*.json chd.log mlb_rosters_cache.json parlayos.html index.html || true
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "CHD daily build $(date +%Y-%m-%d)"
          git push origin HEAD:main

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chd-outputs
          path: |
            parlayos_*.json
            parlayos.html
            index.html
            chd.log
            mlb_rosters_cache.json
