name: Live Scores (Every 5 min 12pm-1am ET)

on:
  schedule:
    # 12pm-11:55pm ET = 16:00-03:55 UTC (EDT, UTC-4) - every 5 min
    - cron: '*/5 16-23 * * *'
    # 12am-1am ET = 04:00-05:00 UTC next day - every 5 min
    - cron: '*/5 0-4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-live-scores
  cancel-in-progress: true

jobs:
  live-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --break-system-packages -r requirements.txt || pip install requests beautifulsoup4

      - name: Update Live Scores (FREE - MLB Stats API, no ODDS_API_KEY burn)
        run: |
          echo "Live score update - $(date -u) UTC / $(TZ='America/New_York' date) ET"
          python live_scores.py
          ls -lh live_scores.json parlayos.html index.html
          cat live_scores.json | head -100
          touch .nojekyll
          mkdir -p data
          cp -f live_scores.json data/live_scores.json || true
          # Verify no leak
          if grep -q "Sample Team" index.html; then echo "Sample leak!"; exit 1; fi
          if grep -q "^def run" index.html; then echo "Code leak!"; exit 1; fi

      - name: Checkout PUBLIC repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PUBLIC_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Copy to public repo (HTML + live_scores.json)
        run: |
          echo "=== LIVE: Copying index.html + live_scores.json ==="
          cp -f index.html public-repo/index.html
          cp -f live_scores.json public-repo/live_scores.json
          cp -f .nojekyll public-repo/.nojekyll
          mkdir -p public-repo/data
          cp -f live_scores.json public-repo/data/live_scores.json || true
          cp -f data/live_scores.json public-repo/data/live_scores.json || true
          echo "Public repo contents:"
          ls -lh public-repo/
          ls -lh public-repo/data/ || true
          if ls public-repo/*.py 1>/dev/null 2>&1; then
            echo "ERROR: .py files in public repo!"
            exit 1
          fi
          echo "live_scores.json preview:"
          cat public-repo/live_scores.json | head -50

      - name: Commit and push live scores
        working-directory: public-repo
        run: |
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html live_scores.json .nojekyll data/live_scores.json
          git diff --staged --quiet && echo "No changes - scores unchanged" && exit 0
          git commit -m "live: $(date -u +%Y-%m-%dT%H:%M:%SZ) ET:$(TZ='America/New_York' date +%H:%M) - live scores $(jq -r '.count' live_scores.json) games"
          git push origin HEAD:main

      - name: Backup to private repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html live_scores.json data/live_scores.json
          git diff --staged --quiet && exit 0
          git commit -m "live backup $(date -u +%Y-%m-%dT%H:%M:%SZ) $(jq -r '.count' live_scores.json 2>/dev/null || echo '0') games" || true
          git push origin HEAD:main || true
