
name: Build and Deploy to Public

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --break-system-packages -r requirements.txt || pip install requests

      - name: Build HTML (private engines stay private)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "Building with secret keys (never exposed to public repo)"
          python run_all.py || echo "::warning:: build partial"
          ls -lh parlayos.html index.html
          if [ ! -f index.html ]; then cp parlayos.html index.html; fi

      - name: Deploy to PUBLIC repo (index.html ONLY - no checkout@v4 API)
        env:
          PUBLIC_REPO_NAME: ${{ secrets.PUBLIC_REPO_NAME }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          echo "PUBLIC_REPO_NAME: $PUBLIC_REPO_NAME"
          echo "TOKEN set? $([ -n "$PUBLIC_REPO_TOKEN" ] && echo YES || echo NO)"
          
          if [ -z "$PUBLIC_REPO_NAME" ] || [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "❌ Secrets missing - skipping public deploy"
            exit 0
          fi
          
          rm -rf public-repo
          mkdir public-repo
          
          echo "=== Cloning public repo with token (bypasses API default-branch check) ==="
          if git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO_NAME}.git public-repo; then
            echo "✅ Clone succeeded"
          else
            echo "⚠️ Clone failed - trying init empty repo"
            cd public-repo
            git init
            git remote add origin https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO_NAME}.git
            git checkout -b main
            cd ..
          fi
          
          ls -lh public-repo/ || true
          
          echo "=== Copying ONLY index.html (no .py files) ==="
          cp -f index.html public-repo/index.html
          cp -f _headers public-repo/_headers 2>/dev/null || true
          cp -f _redirects public-repo/_redirects 2>/dev/null || true
          
          cd public-repo
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git branch -M main || true
          git add -f index.html
          git add _headers _redirects 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes to public repo"
            exit 0
          fi
          
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ) - live picks"
          echo "Pushing to public repo..."
          git push origin main -f || git push origin HEAD:main

      - name: Also update private repo (backup)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html || true
          git diff --staged --quiet && echo "No private changes" && exit 0
          git commit -m "auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:main || true
