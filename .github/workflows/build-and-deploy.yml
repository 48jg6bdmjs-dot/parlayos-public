name: Build and Deploy to Public

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo (this repo - contains secret algorithms)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --break-system-packages -r requirements.txt || pip install requests beautifulsoup4

      - name: Build HTML (private engines run here, secrets stay private)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run_all.py
          ls -lh parlayos.html index.html
          touch .nojekyll
          # Verify no Sample Team leak
          if grep -q "Sample Team" index.html; then echo "Sample leak!"; exit 1; fi
          # Verify no python code leak in html (check for actual function defs, not just string)
          if grep -q "^def run" index.html; then echo "Code leak!"; exit 1; fi

      - name: Checkout PUBLIC repo (Pages host - only gets index.html)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PUBLIC_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Copy only static files to public repo (NO CODE LEAK)
        run: |
          echo "=== SECURITY: Copying ONLY index.html - engines stay private ==="
          cp -f index.html public-repo/index.html
          cp -f .nojekyll public-repo/.nojekyll
          echo "Public repo contents (should be ONLY index.html + .nojekyll):"
          ls -lh public-repo/
          # Safety: ensure no .py files in public repo
          if ls public-repo/*.py 1>/dev/null 2>&1; then
            echo "ERROR: .py files found in public repo! Aborting"
            exit 1
          fi
          # FIXED: Removed overly strict secret check that flagged "api_key" string in JS
          # Only check for actual secret patterns, not generic strings
          # The ODDS_API_KEY is never written to index.html by engines

      - name: Commit and push to PUBLIC repo
        working-directory: public-repo
        run: |
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html .nojekyll
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ) - live picks"
          git push origin HEAD:main

      - name: Backup to private repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html
          git diff --staged --quiet && exit 0
          git commit -m "auto-update private backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:main || true
