name: Build and Deploy to Public

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt || pip install requests beautifulsoup4

      - name: Build HTML (private engines run here, secrets stay private)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "Building with secret keys (never exposed to public repo)"
          python run_all.py
          ls -lh parlayos.html index.html
          head -20 index.html

      - name: Checkout PUBLIC repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PUBLIC_REPO_NAME }} # e.g. tdcupvon/parlayos-public
          token: ${{ secrets.PUBLIC_REPO_TOKEN }} # PAT with repo scope
          path: public-repo

      - name: Copy only static files to public repo (NO CODE)
        run: |
          echo "Copying ONLY index.html - no .py files leak"
          cp -f index.html public-repo/index.html
          # Optional: copy assets if you have them
          # cp -r assets public-repo/ 2>/dev/null || true
          ls -lh public-repo/

      - name: Commit and push to PUBLIC repo
        working-directory: public-repo
        run: |
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main

      - name: Also update private repo (backup)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html
          git diff --staged --quiet && exit 0
          git commit -m "auto-update private backup" || true
          git push origin HEAD:main || true