name: Build and Deploy to Public

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    # Don't run if the push was from this bot itself (prevents loop)
    if: github.actor != 'parlayos-bot'
    steps:
      - name: Checkout PRIVATE repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt || pip install requests beautifulsoup4

      - name: Build HTML (private - keys stay secret)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run_all.py
          ls -lh index.html
          wc -l index.html

      - name: Checkout PUBLIC repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PUBLIC_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Copy ONLY index.html (NO .py files)
        run: |
          cp -f index.html public-repo/index.html
          ls -lh public-repo/

      - name: Push to PUBLIC repo
        working-directory: public-repo
        run: |
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main
