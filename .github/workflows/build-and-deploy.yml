name: Build and Deploy to Public

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --break-system-packages -r requirements.txt || pip install requests beautifulsoup4 || true

      - name: Build - Real data only (no demo)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run_all.py
          ls -lh parlayos.html index.html
          cp -f parlayos.html index.html || true
          touch .nojekyll
          if grep -q "Sample Team" index.html; then echo "Sample leak!"; exit 1; fi

      - name: Push to PUBLIC repo (Pages host) - fixed newline issue
        env:
          PUBLIC_REPO_NAME: ${{ secrets.PUBLIC_REPO_NAME }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # TRIM BOTH secrets - removes newlines that cause "credential url cannot be parsed"
          PUBLIC_REPO_NAME_TRIMMED=$(echo "$PUBLIC_REPO_NAME" | tr -d '\r\n' | xargs)
          PUBLIC_REPO_TOKEN_TRIMMED=$(echo "$PUBLIC_REPO_TOKEN" | tr -d '\r\n' | xargs | tr -d ' ')
          
          echo "Public repo: $PUBLIC_REPO_NAME_TRIMMED"
          echo "Token length: ${#PUBLIC_REPO_TOKEN_TRIMMED}"
          echo "Token set? $([ -n "$PUBLIC_REPO_TOKEN_TRIMMED" ] && echo YES || echo NO)"
          
          if [ -z "$PUBLIC_REPO_NAME_TRIMMED" ] || [ -z "$PUBLIC_REPO_TOKEN_TRIMMED" ]; then
            echo "Missing secrets"
            exit 0
          fi
          
          rm -rf public-repo
          
          # Build URL with trimmed token - quoted
          CLONE_URL="https://x-access-token:${PUBLIC_REPO_TOKEN_TRIMMED}@github.com/${PUBLIC_REPO_NAME_TRIMMED}.git"
          
          echo "Cloning..."
          if git clone "$CLONE_URL" public-repo; then
            echo "✅ Clone OK"
          else
            echo "⚠️ Clone failed - init new repo"
            mkdir -p public-repo
            cd public-repo
            git init
            git branch -M main
            git remote add origin "$CLONE_URL"
            cd ..
          fi
          
          cp -f index.html public-repo/index.html
          cp -f .nojekyll public-repo/.nojekyll
          cd public-repo
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git branch -M main
          git add -f index.html .nojekyll
          
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Pushing..."
          git push origin main -f || git push origin HEAD:main

      - name: Backup to private main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html || true
          git diff --staged --quiet && exit 0
          git commit -m "auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:main || true
