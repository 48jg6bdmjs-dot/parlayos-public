name: Build and Deploy to Public

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo (contains secret algorithms)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --break-system-packages -r requirements.txt || pip install requests beautifulsoup4

      - name: Build HTML + Live Scores (private engines, public scores only)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run_all.py
          echo "Fetching live MLB scores from free MLB API (no key needed, safe for public)..."
          python -c "
import requests, json
from datetime import datetime, timezone
url='https://statsapi.mlb.com/api/v1/schedule?sportId=1&hydrate=team,linescore'
games=[]
try:
    r=requests.get(url,timeout=15)
    data=r.json()
    for d in data.get('dates',[]):
        for g in d.get('games',[]):
            status=g.get('status',{}).get('detailedState','')
            abstract=g.get('status',{}).get('abstractGameState','')
            is_live=abstract=='Live' or 'In Progress' in status
            is_final=abstract=='Final'
            if not (is_live or is_final): continue
            teams=g.get('teams',{})
            away=teams.get('away',{})
            home=teams.get('home',{})
            linescore=g.get('linescore',{})
            games.append({
                'lg':'MLB',
                'a':away.get('team',{}).get('teamName','Away'),
                'b':home.get('team',{}).get('teamName','Home'),
                'aAbbr':away.get('team',{}).get('abbreviation','AWY'),
                'bAbbr':home.get('team',{}).get('abbreviation','HME'),
                'aScore':away.get('score',0),
                'bScore':home.get('score',0),
                'status':status,
                'inning':(linescore.get('currentInningOrdinal','')+' '+linescore.get('inningState','')).strip() if linescore.get('currentInningOrdinal') else status,
                'final':is_final,
                'date':d.get('date')
            })
except Exception as e:
    print(f'Live fetch error: {e}')
payload={'games':games,'updated':datetime.now(timezone.utc).isoformat(),'count':len(games)}
open('live_scores.json','w').write(json.dumps(payload,indent=2))
print(f'Wrote live_scores.json with {len(games)} games')
          "
          ls -lh parlayos.html index.html live_scores.json || true
          touch .nojekyll
          if grep -q "Sample Team" index.html; then echo "Sample leak!"; exit 1; fi

      - name: Checkout PUBLIC repo (Pages host - only gets static files)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PUBLIC_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Copy only static files (NO .py CODE LEAK - protects algorithm)
        run: |
          echo "=== SECURITY: Only index.html + live_scores.json -> public ==="
          cp -f index.html public-repo/index.html
          cp -f live_scores.json public-repo/live_scores.json 2>/dev/null || echo '{"games":[],"updated":"none"}' > public-repo/live_scores.json
          cp -f .nojekyll public-repo/.nojekyll
          ls -lh public-repo/
          if ls public-repo/*.py 1>/dev/null 2>&1; then echo "ERROR .py leak!"; exit 1; fi

      - name: Commit and push to PUBLIC repo
        working-directory: public-repo
        run: |
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html .nojekyll live_scores.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ) - picks + live scores"
          git push origin HEAD:main

      - name: Backup to private repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html live_scores.json
          git diff --staged --quiet && exit 0
          git commit -m "auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:main || true
