name: Build and Deploy ParlayOS - CHD v2 No Gate

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: parlayos-public-deploy
  cancel-in-progress: false

jobs:
  build-and-push-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIVATE repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt || pip install requests beautifulsoup4 python-dateutil
          echo "ODDS_API_KEY present: ${{ secrets.ODDS_API_KEY != '' }}"

      - name: Build CHD Unified (Uses ODDS_API_KEY secret)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "=== CHD Build - ODDS_API_KEY from GitHub Secrets ==="
          echo "Key length: ${#ODDS_API_KEY}"
          python chd_unified_all.py
          ls -lh parlayos.html index.html
          touch .nojekyll
          # Verify no gate
          if grep -q "accessGate" parlayos.html; then echo "Gate still present!"; exit 1; fi
          # Verify unlock only
          if ! grep -q "coverUnlockBtn" parlayos.html; then echo "Unlock missing!"; exit 1; fi
          # Verify chips deleted
          if grep -q 'data-stab="pitching"' parlayos.html; then echo "Pitching chip not deleted!"; exit 1; fi
          if grep -q 'data-stab="lineups"' parlayos.html; then echo "Lineups chip not deleted!"; exit 1; fi
          # Verify dashboard data
          if ! grep -q "PARLAYOS_DATA" parlayos.html; then echo "No data!"; exit 1; fi
          cp parlayos.html index.html
          echo "Build OK - No gate, unlock only, 14 NFL games, no pitching/lineups chips"

      - name: Checkout PUBLIC repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PUBLIC_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Copy to public (NO SECRETS LEAK)
        run: |
          cp -f index.html public-repo/index.html
          cp -f .nojekyll public-repo/.nojekyll
          ls -lh public-repo/
          if ls public-repo/*.py 1>/dev/null 2>&1; then echo "PY leak!"; exit 1; fi

      - name: Commit and push public
        working-directory: public-repo
        run: |
          git config user.name "parlayos-bot"
          git config user.email "bot@parlayos.com"
          git add -f index.html .nojekyll
          git diff --staged --quiet && exit 0
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ) - CHD v2 no gate unlock only"
          git push origin HEAD:main

      - name: Backup private
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html
          git diff --staged --quiet && exit 0
          git commit -m "auto-backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:main || true
