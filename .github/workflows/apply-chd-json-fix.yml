name: Apply CHD JSON wiring fix

on:
  push:
    branches:
      - fix/chd-json-wiring-pr

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/chd-json-wiring-pr

      - name: Patch predictor wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chd_master_predictor.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const games=data.mlb||[];', 'const games=(data.mlb&&data.mlb.games)?data.mlb.games:[];')
          s = s.replace('json.dumps(data["mlb_data"], indent=2, default=str)', 'json.dumps({"mlb":data["mlb_data"]}, indent=2, default=str)')
          s = s.replace('json.dumps(data["nfl_data"], indent=2, default=str)', 'json.dumps({"nfl":data["nfl_data"]}, indent=2, default=str)')
          s = s.replace('json.dumps(data["nba_data"], indent=2, default=str)', 'json.dumps({"nba":data["nba_data"]}, indent=2, default=str)')
          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile chd_master_predictor.py
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chd_master_predictor.py
          git commit -m 'Fix ParlayOS CHD JSON data wiring'
          git push origin fix/chd-json-wiring-pr

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-chd-json-fix.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push origin fix/chd-json-wiring-pr
