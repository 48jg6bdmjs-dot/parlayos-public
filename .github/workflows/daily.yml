name: Daily ParlayOS Update

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-main
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --break-system-packages -r requirements.txt || pip install -r requirements.txt

      - name: Run all three prediction engines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run_all.py || true
          ls -lh index.html parlayos.html

      - name: Deploy to static.app (if secret exists)
        env:
          STATIC_APP_KEY: ${{ secrets.STATIC_APP }}
        run: |
          if [ -z "$STATIC_APP_KEY" ]; then
            echo "⚠️ STATIC_APP secret not found in GitHub - skipping static.app deploy"
            echo "Add it: GitHub → Settings → Secrets → New secret → Name: STATIC_APP, Value: your static.app API key"
            exit 0
          fi
          zip -j deploy.zip index.html parlayos.html
          echo "Deploying to static.app with key ${#STATIC_APP_KEY} chars"
          curl -X POST https://api.static.app/deploy -H "Authorization: Bearer $STATIC_APP_KEY" -F "file=@deploy.zip" || echo "Deploy attempt done, check static.app dashboard"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f parlayos.html index.html || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "auto-update: picks"
          git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push)
