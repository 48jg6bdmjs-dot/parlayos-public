name: Daily ParlayOS Update

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlayos-main
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --break-system-packages -r requirements.txt || pip install -r requirements.txt

      - name: Run all three prediction engines (MLB, NFL, NBA) V3 ULTRA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "ODDS_API_KEY set: $([ -n "$ODDS_API_KEY" ] && echo true || echo false)"
          python run_all.py || echo "::warning::run_all.py failed partially - continuing"
          ls -lh parlayos.html index.html || true

      - name: Deploy to static.app
        env:
          STATIC_APP_API_KEY: ${{ secrets.STATIC_APP_API_KEY }}
        run: |
          echo "Deploying to static.app..."
          # static.app deploys via zip upload API
          # Create zip of site
          zip -r site.zip index.html parlayos.html -x "*.py" "*.yml" "*.toml" ".git/*" "__pycache__/*" || true
          
          # Use static.app API - upload to your site
          # Get site ID from static.app dashboard or use default
          # The API key you added as STATIC_APP_API_KEY will be used
          
          # If you use static.app GitHub Action (recommended):
          echo "Site built, ready for static.app deploy"
          ls -lh *.html

      - name: Deploy via static.app Action
        uses: static-app/action@v1
        with:
          api-key: ${{ secrets.STATIC_APP_API_KEY }}
          # If you have a specific site ID, add it:
          # site-id: ${{ secrets.STATIC_APP_SITE_ID }}
          # Otherwise it deploys to default site linked to API key
          path: .
          # Only deploy html files
          include: |
            index.html
            parlayos.html

      - name: Commit and push changes (conflict-safe backup)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for f in sports_config.json picks_log.csv nfl_picks_log.csv nba_picks_log.csv parlayos.html index.html; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "auto-update: MLB/NFL/NBA V3 ULTRA picks, highlights + config (3x daily)"

          for i in 1 2 3 4 5; do
            echo "=== Push attempt $i ==="
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict - keeping our generated parlayos.html"
              git checkout --theirs -- parlayos.html index.html 2>/dev/null || true
              git add -f parlayos.html index.html
              git -c core.editor=true rebase --continue 2>/dev/null || git rebase --skip 2>/dev/null || {
                echo "Rebase still failing - hard reset and regenerate"
                git rebase --abort || true
                git reset --hard origin/main
                python run_all.py || true
                git add -f parlayos.html index.html sports_config.json picks_log.csv nfl_picks_log.csv nba_picks_log.csv 2>/dev/null || true
                git commit -m "auto-update: MLB/NFL/NBA V3 ULTRA picks (resolved conflict)" || true
              }
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, retrying in 5s..."
            sleep 5
          done
          exit 1
