name: Deploy ParlayOS to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production runtime artifact contract
        run: |
          set -euo pipefail
          for f in parlayos_chd_data.json parlayos_mlb_chd.json parlayos_nfl_chd.json parlayos_nba_chd.json live_scores.json data/live_scores.json; do
            test -s "$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              'MLB': 'parlayos_mlb_chd.json',
              'NFL': 'parlayos_nfl_chd.json',
              'NBA': 'parlayos_nba_chd.json',
          }
          required_models = {
              'monte_carlo', 'zips', 'steamer', 'my_chd',
              'season_stats', 'chd_master_predictor', 'final_combined'
          }
          payloads = {}
          for sport, path in files.items():
              payload = json.loads(Path(path).read_text(encoding='utf-8'))
              games = payload.get('games')
              assert isinstance(games, list), f'{sport}: games missing'
              for i, game in enumerate(games):
                  assert isinstance(game, dict), f'{sport}[{i}]: invalid game'
                  models = game.get('models')
                  assert isinstance(models, dict), f'{sport}[{i}]: models missing'
                  assert required_models <= set(models), f'{sport}[{i}]: missing seven-model contract'
                  for model_id in required_models:
                      assert isinstance(models[model_id], dict), f'{sport}[{i}]/{model_id}: invalid model record'
                      assert models[model_id].get('model_id') == model_id, f'{sport}[{i}]/{model_id}: model_id mismatch'
                  assert isinstance(game.get('ensemble'), dict), f'{sport}[{i}]: ensemble missing'
              payloads[sport] = payload
              print(f'OK {sport}: {len(games)} games')

          combined = json.loads(Path('parlayos_chd_data.json').read_text(encoding='utf-8'))
          for sport, payload in payloads.items():
              section = combined.get(sport.lower())
              assert isinstance(section, dict), f'combined missing {sport}'
              assert section.get('games') == payload['games'], f'combined mismatch {sport}'

          root_live = Path('live_scores.json')
          mirror_live = Path('data/live_scores.json')
          assert root_live.read_bytes() == mirror_live.read_bytes(), 'live score root/data mirror mismatch'
          live = json.loads(root_live.read_text(encoding='utf-8'))
          sports = live.get('sports')
          assert isinstance(sports, dict), 'live_scores sports map missing'
          for sport in ('MLB', 'NFL', 'NBA', 'SOC', 'NHL'):
              assert isinstance(sports.get(sport), list), f'live_scores missing {sport}'
              for i, game in enumerate(sports[sport]):
                  assert isinstance(game, dict), f'{sport}[{i}]: invalid live-score game'
                  assert game.get('a') or game.get('away'), f'{sport}[{i}]: away team missing'
                  assert game.get('b') or game.get('home'), f'{sport}[{i}]: home team missing'
          assert isinstance(live.get('games'), list), 'live_scores legacy games missing'

          index = Path('index.html').read_text(encoding='utf-8')
          parlayos = Path('parlayos.html').read_text(encoding='utf-8')
          assert index == parlayos, 'HTML parity mismatch'
          required_runtime = [
              "const REQUIRED_SPORTS=['mlb','nfl','nba'];",
              "const OPTIONAL_SPORTS=['soc','nhl'];",
              'PARLAYOS_SPORT_HUBS_LIVE_SCORES',
              'parlayos-live-score-chip',
              'parlayos-hub-screen-title',
              'PREDICTIONS',
          ]
          for token in required_runtime:
              assert token in index, f'dashboard runtime token missing: {token}'
          forbidden_runtime = [
              'id="parlayos-live-scores-v7"',
              "for(const s of SPORTS)payloads[s]=await get(SRC[s])",
              "const games=A(payloads[s]?.games)",
              'id="PARLAYOS_SPORTS_UNIFIED_V3"',
              'id="PARLAYOS_UNIFIED_SPORTS_UI_TUNING"',
              'ParlayOS Sports Hubs',
          ]
          for token in forbidden_runtime:
              assert token not in index, f'obsolete/blocking runtime present: {token}'
          print('OK production prediction, live-score, hub runtime, and artifact parity contracts')
          PY

      - name: Prepare artifact
        run: |
          mkdir -p site/data
          cp index.html parlayos.html about.html favicon.ico site/
          cp parlayos_chd_data.json parlayos_mlb_chd.json parlayos_nfl_chd.json parlayos_nba_chd.json live_scores.json site/
          cp data/live_scores.json site/data/live_scores.json
          ls -lh site site/data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
