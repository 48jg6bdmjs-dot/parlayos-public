name: Deploy ParlayOS to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate five-sport runtime artifact contract
        run: |
          set -euo pipefail
          for f in parlayos_chd_data.json parlayos_mlb_chd.json parlayos_nfl_chd.json parlayos_nba_chd.json parlayos_nhl_chd.json parlayos_soccer_chd.json live_scores.json data/live_scores.json; do
            test -s "$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              'MLB': 'parlayos_mlb_chd.json',
              'NFL': 'parlayos_nfl_chd.json',
              'NBA': 'parlayos_nba_chd.json',
              'NHL': 'parlayos_nhl_chd.json',
              'SOC': 'parlayos_soccer_chd.json',
          }
          required_models = {
              'monte_carlo', 'zips', 'steamer', 'my_chd',
              'season_stats', 'chd_master_predictor', 'final_combined'
          }
          payloads = {}
          for sport, path in files.items():
              payload = json.loads(Path(path).read_text(encoding='utf-8'))
              games = payload.get('games')
              assert isinstance(games, list), f'{sport}: games missing'
              for i, game in enumerate(games):
                  assert isinstance(game, dict), f'{sport}[{i}]: invalid game'
                  models = game.get('models')
                  assert isinstance(models, dict), f'{sport}[{i}]: models missing'
                  assert required_models <= set(models), f'{sport}[{i}]: missing seven-model contract'
                  for model_id in required_models:
                      assert isinstance(models[model_id], dict), f'{sport}[{i}]/{model_id}: invalid model record'
                      assert models[model_id].get('model_id') == model_id, f'{sport}[{i}]/{model_id}: model_id mismatch'
                  assert isinstance(game.get('ensemble'), dict), f'{sport}[{i}]: ensemble missing'
              payloads[sport] = payload
              print(f'OK {sport}: {len(games)} games')

          combined = json.loads(Path('parlayos_chd_data.json').read_text(encoding='utf-8'))
          for sport, payload in payloads.items():
              section = combined.get(sport.lower())
              assert isinstance(section, dict), f'combined missing {sport}'
              assert section.get('games') == payload['games'], f'combined mismatch {sport}'

          live = json.loads(Path('live_scores.json').read_text(encoding='utf-8'))
          for sport in files:
              assert isinstance(live.get('sports', {}).get(sport), list), f'live_scores missing {sport}'
          assert isinstance(live.get('games'), list), 'live_scores games missing'
          assert Path('index.html').read_text(encoding='utf-8') == Path('parlayos.html').read_text(encoding='utf-8'), 'HTML parity mismatch'
          print('OK five-sport public artifact contract')
          PY

      - name: Validate browser JavaScript and UI contract
        run: |
          node --input-type=commonjs <<'JS'
          const fs = require('node:fs'), vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          let count = 0;
          for (const match of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)) {
            if (/type=["'](?:application\/json|application\/ld\+json)["']/i.test(match[1]) || /\bsrc=/.test(match[1])) continue;
            new vm.Script(match[2], {filename: 'inline-script-' + (++count)});
          }
          for (const id of ['PARLAYOS_UI_BOOT', 'PARLAYOS_UI_CONTRACT', 'PARLAYOS_UI_CONSISTENCY']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing ' + id);
          }
          console.log('Validated ' + count + ' browser scripts and shared UI');
          JS

      - name: Prepare artifact
        run: |
          mkdir -p site/data
          cp index.html parlayos.html about.html favicon.ico site/
          cp parlayos_chd_data.json parlayos_mlb_chd.json parlayos_nfl_chd.json parlayos_nba_chd.json parlayos_nhl_chd.json parlayos_soccer_chd.json live_scores.json site/
          cp live_scores.json site/data/live_scores.json
          ls -lh site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
