name: Deploy ParlayOS to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Prepare artifact
        run: |
          mkdir -p site/data
          cp index.html parlayos.html about.html favicon.ico site/
          cp parlayos_chd_data.json parlayos_mlb_chd.json parlayos_nfl_chd.json parlayos_nba_chd.json live_scores.json site/
          cp live_scores.json site/data/live_scores.json
          ls -lh site
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
