take=Number(stake);odds=Number(odds);\n    if(!String(label||'').trim())throw Error('Enter a slip name or selection.');\n    if(!Number.isFinite(stake)||stake\u003c=0||Math.abs(stake*100-Math.round(stake*100))>1e-7)throw Error('Enter a positive wager with at most two decimal places.');\n    if(stake>num(data.balance))throw Error('Wager exceeds the available virtual balance.');\n    if(!Number.isInteger(odds)||Math.abs(odds)\u003c100)throw Error('Enter American odds of +100 or higher, or \u2212100 or lower.');\n    if(!id||rows(data.pending).some(p=>p.id===id))throw Error('Slip identifier already exists.');\n    const balance=Math.round((num(data.balance)-stake)*100)/100,date=new Date(now).toLocaleDateString();\n    return {...data,balance,pending:[...rows(data.pending),{id,label:String(label).trim(),stake,odds,legs,placedDate:date,ts:now}],history:[...rows(data.history),{balance,label:String(label).trim()+' (staked)',profit:-stake,date,ts:now,isStake:true,pendingId:id}]};\n  }\n  function settle(data,id,outcome,now=Date.now()){\n    const bet=rows(data.pending).find(p=>p.id===id);if(!bet||!['win','loss','push'].includes(outcome))throw Error('This pending slip is no longer available.');\n    const stake=num(bet.stake),odds=num(bet.odds);if(stake\u003c=0||Math.abs(odds)\u003c100)throw Error('This saved slip has invalid wager or odds data.');\n    const profit=Math.round((outcome==='win'?stake*(odds>0?odds/100:100/-odds):outcome==='loss'?-stake:0)*100)/100;\n    const balance=Math.round((num(data.balance)+stake+profit)*100)/100;\n    return {...data,balance,pending:data.pending.filter(p=>p.id!==id),history:[...rows(data.history),{balance,label:bet.label,profit,stake,odds,date:new Date(now).toLocaleDateString(),ts:now,isSettlement:true,result:outcome,legs:bet.legs,slipId:bet.id,placedDate:bet.placedDate}]};\n  }\n  let host,dialog,filter='all',search='',signature='',opener;\n  const q=s=>document.querySelector(s),read=()=>window.brLoad?.();\n  function save(data){if(typeof window.brSave!=='function'||window.brSave(data)===false)throw Error('Could not save the bankroll. Try again.');window.renderBankroll?.();signature='';render();}\n  function pct(x){return x===null?'\u2014':(x*100).toFixed(1)+'%';}\n  function chart(s){\n    if(!s.settled.length)return '\u003cdiv class=\"pos-bank-empty\">Your performance chart starts with your first settled slip.\u003c/div>';\n    const values=[0];s.settled.forEach(h=>values.push(values.at(-1)+num(h.profit)));\n    const lo=Math.min(...values),hi=Math.max(...values),range=hi-lo||1;\n    const points=values.map((v,i)=>(12+i/(values.length-1)*776).toFixed(1)+','+(150-(v-lo)/range*126).toFixed(1)).join(' ');\n    return `\u003csvg viewBox=\"0 0 800 180\" role=\"img\" aria-label=\"Settled profit over ${s.settled.length} slips, ending at ${escape(signed(s.pnl))}\">\u003cline x1=\"12\" y1=\"${150-(0-lo)/range*126}\" x2=\"788\" y2=\"${150-(0-lo)/range*126}\" stroke=\"currentColor\" opacity=\".25\" stroke-dasharray=\"4 6\"/>\u003cpolyline points=\"${points}\" fill=\"none\" stroke=\"var(--pos-accent)\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"/>\u003c/svg>\u003cdiv class=\"pos-bank-axis\">\u003cspan>First slip\u003c/span>\u003cspan>Range ${money(lo)} to ${money(hi)}\u003c/span>\u003cspan>Latest\u003c/span>\u003c/div>`;\n  }\n  function slip(item,pending){\n    const status=pending?'Pending':({win:'Won',loss:'Lost',push:'Push'})[item.outcome];\n    const legs=rows(item.legs);return `\u003cdetails class=\"pos-bank-slip\">\u003csummary>\u003cdiv>\u003cspan class=\"pos-bank-badge\" data-outcome=\"${pending?'pending':item.outcome}\">${status}\u003c/span>\u003ch4>${escape(item.label||'Saved slip')}\u003c/h4>\u003cp>${escape(pending?item.placedDate:item.date)||'Date unavailable'} \u00b7 Wager ${valid(item.stake)?money(item.stake):'unavailable'}${valid(item.odds)?' \u00b7 '+(Number(item.odds)>0?'+':'')+escape(item.odds):''}\u003c/p>\u003c/div>\u003cstrong class=\"pos-bank-return\" data-outcome=\"${pending?'pending':item.outcome}\">${pending?money(item.stake):signed(num(item.profit))}\u003csmall>${pending?'at risk':'net result'}\u003c/small>\u003c/strong>\u003c/summary>\u003cdiv class=\"pos-bank-slip-body\">${legs.length?'\u003col>'+legs.map(l=>'\u003cli>'+escape(typeof l==='object'?(l.pick||l.label||l.selection||'Saved leg'):l)+'\u003c/li>').join('')+'\u003c/ol>':'\u003cp>No individual legs were saved with this slip.\u003c/p>'}${pending?`\u003cdiv class=\"pos-actions\">${['win','loss','push'].map(x=>`\u003cbutton type=\"button\" data-bank-settle=\"${x}\" data-bank-id=\"${escape(item.id)}\">Mark ${x}\u003c/button>`).join('')}\u003c/div>`:''}\u003c/div>\u003c/details>`;\n  }\n  function render(){\n    if(!host)return;const data=read();if(!data){q('#pos-bank-overview').innerHTML='\u003cp>Bankroll data is not available yet.\u003c/p>';return;}\n    const stamp=JSON.stringify([data,filter,search]);if(stamp===signature)return;signature=stamp;\n    const s=summary(data),metric=(label,value,detail)=>`\u003cdiv class=\"pos-bank-metric\">\u003cspan>${label}\u003c/span>\u003cstrong>${value}\u003c/strong>\u003csmall>${detail}\u003c/small>\u003c/div>`;\n    q('#pos-bank-overview').innerHTML=`\u003cdiv class=\"pos-bank-balance\">\u003cspan>Available virtual balance\u003c/span>\u003cstrong>${money(s.balance)}\u003c/strong>\u003cp>${money(s.atRisk)} committed to ${s.pending.length} pending ${s.pending.length===1?'slip':'slips'}\u003c/p>\u003c/div>\u003cdiv class=\"pos-bank-metrics\">${metric('Settled profit',signed(s.pnl),'Pending wagers excluded')}${metric('Win rate',pct(s.winRate),s.wins+' wins \u00b7 '+s.losses+' losses \u00b7 '+s.pushes+' pushes')}${metric('Return on wagers',pct(s.roi),s.roi===null?'Requires saved settled wager amounts':money(s.stakeTotal)+' settled wagers')}\u003c/div>`;\n    q('#pos-bank-chart').innerHTML=chart(s);\n    q('#pos-bank-pending-count').textContent=s.pending.length;\n    const list=q('#pos-bank-pending'),open=new Set(Array.from(list.querySelectorAll('details[open]')).map(el=>el.querySelector('[data-bank-id]')?.dataset.bankId));\n    list.innerHTML=s.pending.length?s.pending.map(h=>slip(h,true)).join(''):'\u003cdiv class=\"pos-bank-empty\">\u003cb>No pending slips\u003c/b>\u003cp>Log an existing wager to track its result here.\u003c/p>\u003c/div>';\n    list.querySelectorAll('details').forEach(d=>{if(open.has(d.querySelector('[data-bank-id]')?.dataset.bankId))d.open=true;});\n    const matches=s.settled.filter(h=>(filter==='all'||h.outcome===filter)&&String(h.label||'').toLowerCase().includes(search.toLowerCase())).reverse();\n    q('#pos-bank-history-count').textContent=matches.length+' of '+s.settled.length+' slips';\n    q('#pos-bank-history').innerHTML=matches.length?matches.map(h=>slip(h,false)).join(''):`\u003cdiv class=\"pos-bank-empty\">\u003cb>${s.settled.length?'No matching slips':'No settled slips yet'}\u003c/b>\u003cp>${s.settled.length?'Try a different filter or search.':'Wins, losses and pushes will appear here after you record a result.'}\u003c/p>\u003c/div>`;\n  }\n  function open(title,body){opener=document.activeElement;dialog.innerHTML=`\u003cheader>\u003ch2>${title}\u003c/h2>\u003cbutton type=\"button\" data-bank-close>Close\u003c/button>\u003c/header>${body}`;dialog.showModal();}\n  function close(){dialog.close();opener?.focus();}\n  function boot(){\n    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot,{once:true});return;}\n    const screen=q('#screen-bankroll');if(!screen||q('#pos-bankroll'))return;\n    Array.from(screen.children).forEach(el=>el.setAttribute('data-pos-legacy',''));\n    host=document.createElement('div');host.id='pos-bankroll';host.className='pos-hub pos-bank';\n    host.innerHTML=`\u003cheader class=\"pos-bank-heading\">\u003cdiv>\u003cspan class=\"pos-bank-eyebrow\">YOUR TRACKING SPACE\u003c/span>\u003ch2>Bankroll\u003c/h2>\u003cp>Track wagers. Understand your results.\u003c/p>\u003c/div>\u003cdiv class=\"pos-actions\">\u003cbutton type=\"button\" data-bank-adjust>Adjust starting balance\u003c/button>\u003cbutton type=\"button\" class=\"pos-bank-primary\" data-bank-log>Log a slip\u003c/button>\u003c/div>\u003c/header>\u003csection class=\"pos-bank-hero\" id=\"pos-bank-overview\" aria-label=\"Bankroll overview\">\u003c/section>\u003cdiv class=\"pos-bank-columns\">\u003csection class=\"pos-bank-panel\">\u003cdiv class=\"pos-bank-section-heading\">\u003ch3>Settled performance\u003c/h3>\u003cspan>All time\u003c/span>\u003c/div>\u003cp class=\"pos-meta\">Cumulative net results. Pending stakes do not count as losses.\u003c/p>\u003cdiv id=\"pos-bank-chart\">\u003c/div>\u003c/section>\u003csection class=\"pos-bank-panel\">\u003cdiv class=\"pos-bank-section-heading\">\u003ch3>Pending slips \u003cspan id=\"pos-bank-pending-count\">\u003c/span>\u003c/h3>\u003c/div>\u003cdiv id=\"pos-bank-pending\">\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"pos-bank-panel\">\u003cdiv class=\"pos-bank-section-heading\">\u003ch3>Slip history\u003c/h3>\u003cspan id=\"pos-bank-history-count\">\u003c/span>\u003c/div>\u003cdiv class=\"pos-bank-filters\">\u003cinput type=\"search\" id=\"pos-bank-search\" aria-label=\"Search slip history\" placeholder=\"Search slip names\">\u003cselect id=\"pos-bank-filter\" aria-label=\"Filter slip results\">\u003coption value=\"all\">All results\u003c/option>\u003coption value=\"win\">Won\u003c/option>\u003coption value=\"loss\">Lost\u003c/option>\u003coption value=\"push\">Push\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"pos-bank-history\">\u003c/div>\u003c/section>\u003cdetails class=\"pos-bank-import\">\u003csummary>Import an existing sportsbook slip\u003c/summary>\u003cp>Import tools are optional. Review the wager and odds before logging.\u003c/p>\u003cdiv id=\"pos-bank-import-mount\">\u003c/div>\u003c/details>\u003cp class=\"pos-meta pos-bank-footnote\">Virtual tracking only. Logging or marking a result does not place a bet or move money. Records are saved in this browser.\u003c/p>`;\n    screen.appendChild(host);\n    const importer=q('#brDkTextInput')?.closest('.glass');if(importer){importer.removeAttribute('data-pos-legacy');q('#pos-bank-import-mount').appendChild(importer);}\n    for(const [id,label]of [['brDkLinkInput','Sportsbook share link'],['brDkTextInput','Slip text'],['brDkStakeInput','Imported wager amount'],['brDkOddsInput','Imported American odds']])q('#'+id)?.setAttribute('aria-label',label);\n    dialog=document.createElement('dialog');dialog.className='pos-dialog pos-bank-dialog';dialog.setAttribute('aria-label','Bankroll action');document.body.appendChild(dialog);\n    dialog.addEventListener('cancel',()=>opener?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog||e.target.closest('[data-bank-close]'))close();});\n    document.addEventListener('click',e=>{\n      const b=e.target.closest('button');if(!b)return;\n      if(b.hasAttribute('data-bank-log'))open('Log a slip',`\u003cp>Record a wager you already placed. This only updates your virtual tracker.\u003c/p>\u003cform data-bank-form=\"log\">\u003clabel>Slip name\u003cinput name=\"label\" required maxlength=\"160\" placeholder=\"e.g. Padres moneyline\">\u003c/label>\u003cdiv class=\"pos-bank-form-row\">\u003clabel>Wager ($)\u003cinput name=\"stake\" type=\"number\" inputmode=\"decimal\" min=\"0.01\" step=\"0.01\" required>\u003c/label>\u003clabel>American odds\u003cinput name=\"odds\" type=\"number\" step=\"1\" required placeholder=\"e.g. -110\">\u003c/label>\u003c/div>\u003clabel>Individual legs (optional)\u003ctextarea name=\"legs\" placeholder=\"One selection per line\">\u003c/textarea>\u003c/label>\u003cp role=\"status\" data-bank-message>\u003c/p>\u003cbutton class=\"primary\" type=\"submit\">Save pending slip\u003c/button>\u003c/form>`);\n      if(b.hasAttribute('data-bank-adjust')){const d=read();if(!d)return;open('Adjust starting balance',`\u003cp>Change your starting virtual amount. All pending slips and history are preserved; the available balance changes by the same difference.\u003c/p>\u003cform data-bank-form=\"adjust\">\u003clabel>Starting balance ($)\u003cinput name=\"amount\" type=\"number\" inputmode=\"decimal\" min=\"0.01\" step=\"0.01\" value=\"${num(d.startingBalance)}\" required>\u003c/label>\u003cp role=\"status\" data-bank-message>\u003c/p>\u003cbutton class=\"primary\" type=\"submit\">Save starting balance\u003c/button>\u003c/form>`);}\n      if(b.dataset.bankSettle){const d=read(),bet=rows(d?.pending).find(p=>p.id===b.dataset.bankId);if(!bet)return;open('Record slip result',`\u003cp>${escape(bet.label)} \u00b7 ${money(bet.stake)} wager\u003c/p>\u003cp>Record this slip as \u003cstrong>${escape(b.dataset.bankSettle)}\u003c/strong> in your tracker?\u003c/p>\u003cform data-bank-form=\"settle\" data-id=\"${escape(bet.id)}\" data-outcome=\"${escape(b.dataset.bankSettle)}\">\u003cp role=\"status\" data-bank-message>\u003c/p>\u003cbutton class=\"primary\" type=\"submit\">Confirm result\u003c/button>\u003c/form>`);}\n    });\n    dialog.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.bankForm)return;e.preventDefault();try{const d=read();if(!d)throw Error('Bankroll data is unavailable.');const v=new FormData(f);let next;\n      if(f.dataset.bankForm==='log')next=logSlip(d,{label:v.get('label'),stake:v.get('stake'),odds:v.get('odds'),legs:String(v.get('legs')).split('\\n').map(x=>x.trim()).filter(Boolean),id:crypto.randomUUID()});\n      else if(f.dataset.bankForm==='settle')next=settle(d,f.dataset.id,f.dataset.outcome);\n      else {const amount=Number(v.get('amount')),delta=amount-num(d.startingBalance);if(!Number.isFinite(amount)||amount\u003c=0||num(d.balance)+delta\u003c0)throw Error('Choose an amount that keeps your available balance at or above zero.');next={...d,startingBalance:amount,balance:Math.round((num(d.balance)+delta)*100)/100,history:rows(d.history).map(h=>({...h,balance:valid(h.balance)?Math.round((Number(h.balance)+delta)*100)/100:h.balance}))};}\n      save(next);close();\n    }catch(error){f.querySelector('[data-bank-message]').textContent=error.message;}});\n    q('#pos-bank-search').addEventListener('input',e=>{search=e.target.value;render();});q('#pos-bank-filter').addEventListener('change',e=>{filter=e.target.value;render();});\n    const observer=new MutationObserver(render);for(const id of ['#brBalance','#brLog','#brPending']){const el=q(id);if(el)observer.observe(el,{childList:true,subtree:true,characterData:true});}\n    window.addEventListener('storage',()=>{signature='';render();});render();\n  }\n  return {summary,logSlip,settle,boot,render};\n});\n"}</script>
<script>
const assets=JSON.parse(document.querySelector('#assets').textContent),result=document.querySelector('#result'),run=document.querySelector('#run');let frame;
const delay=ms=>new Promise(r=>setTimeout(r,ms)),assert=(x,m)=>{if(!x)throw Error(m);};
const sample={startingBalance:1000,balance:1025,pending:[{id:'pending',label:'12-pick baseball parlay · long slip name with multiple selections',stake:25,odds:350,legs:['San Diego Padres moneyline','New York Yankees moneyline','Toronto Blue Jays moneyline'],placedDate:'9/10/2026'}],history:[{label:'Start',balance:1000,profit:0},{isStake:true,pendingId:'won',profit:-20,balance:980},{isSettlement:true,slipId:'won',label:'Padres moneyline',stake:20,profit:50,balance:1050,date:'9/9/2026'},{isStake:true,pendingId:'push',profit:-10,balance:1040},{isSettlement:true,slipId:'push',label:'Total runs push',profit:0,balance:1050,date:'9/9/2026'},{isStake:true,pendingId:'pending',profit:-25,balance:1025}]};
function page(data){return '<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+assets.css+'</style><body class="pos-ui"><section id="screen-bankroll" style="padding:16px"></section><script>let fixture='+JSON.stringify(data)+'; window.brLoad=()=>structuredClone(fixture);window.brSave=d=>{fixture=structuredClone(d);return true;};<\/script><script>'+assets.js+'<\/script></body></html>';}
async function mount(data,width){frame?.remove();frame=document.createElement('iframe');frame.width=width;frame.height=1000;frame.title='Bankroll sample preview';frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms');const ready=new Promise(r=>frame.onload=r);frame.srcdoc=page(data);document.querySelector('#preview').appendChild(frame);await ready;await delay(100);return frame.contentDocument;}
document.querySelector('#size').onchange=e=>{if(frame)frame.width=e.target.value;};
run.onclick=async()=>{run.disabled=true;let passed=0;const failures=[];
  for(const width of [390,768,1440])for(const populated of [false,true])try{
    const doc=await mount(populated?sample:{startingBalance:1000,balance:1000,pending:[],history:[]},width),win=frame.contentWindow;
    assert(doc.documentElement.scrollWidth<=width+1,'Horizontal overflow');assert(doc.querySelectorAll('#pos-bankroll').length===1,'Duplicate bankroll screen');
    if(populated){assert(doc.querySelector('#pos-bank-overview').textContent.includes('$50.00'),'Pending stakes counted as loss');assert(doc.querySelector('#pos-bank-history').textContent.includes('Push'),'Push missing');
      const filter=doc.querySelector('#pos-bank-filter');filter.value='loss';filter.dispatchEvent(new Event('change'));assert(doc.querySelector('#pos-bank-history').textContent.includes('No matching slips'),'Filter broken');filter.value='all';filter.dispatchEvent(new Event('change'));
      const search=doc.querySelector('#pos-bank-search');search.value='Padres';search.dispatchEvent(new Event('input'));assert(doc.querySelectorAll('#pos-bank-history details').length===1,'Search broken');search.value='';search.dispatchEvent(new Event('input'));
    }
    doc.querySelector('[data-bank-log]').click();let f=doc.querySelector('form');f.elements.label.value='QA slip';f.elements.stake.value='5000';f.elements.odds.value='-110';f.requestSubmit();assert(f.querySelector('[role=status]').textContent.includes('exceeds'),'Overspend accepted');
    f.elements.stake.value='10';f.requestSubmit();assert(!doc.querySelector('dialog').open,'Slip not saved');const d=win.brLoad();assert(d.pending.at(-1).label==='QA slip','New pending slip absent');
    const buttons=Array.from(doc.querySelectorAll('[data-bank-settle="push"]'));buttons.at(-1).click();f=doc.querySelector('form');f.requestSubmit();const after=win.brLoad();assert(after.balance===(populated?1025:1000),'Push did not refund stake');assert(after.history.at(-1).profit===0,'Push result wrong');
    doc.querySelector('[data-bank-adjust]').click();f=doc.querySelector('form');f.elements.amount.value='1200';f.requestSubmit();assert(win.brLoad().history.length===after.history.length,'Adjust erased history');assert(win.brLoad().balance===after.balance+200,'Adjust balance incorrect');
    passed++;result.textContent='Running: '+passed+' passed';
  }catch(e){failures.push(width+' '+(populated?'saved':'empty')+': '+e.message);}
  await mount(sample,Number(document.querySelector('#size').value));result.textContent=(failures.length?'FAIL':'PASS')+': '+passed+' bankroll/viewport cases, '+failures.length+' failures.\n'+failures.join('\n');run.disabled=false;
};
</script></html>
