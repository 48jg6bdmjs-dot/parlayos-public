<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParlayOS screen layout regression</title>
<style>
  body { font:16px/1.5 system-ui,sans-serif; margin:24px; color:#172033; }
  button { font:inherit; padding:10px 16px; }
  iframe { display:block; border:0; margin-top:16px; }
  pre { white-space:pre-wrap; }
</style>
<h1>Screen layout regression</h1>
<p>Serve the repository with <code>npm run dev</code>, then run this check.
It loads both shipped entrypoints and checks all screen frames in a real browser.
Use a fresh browser profile for verification; the app initializes its usual local preferences.</p>
<button id="menu-run">Run mobile menu checks</button>
<pre id="menu-result" role="status">Menu checks ready.</pre>
<button id="run">Run screen checks</button>
<pre id="result" role="status">Ready.</pre>
<div id="preview"></div>
<script>
const sizes = [[390,844], [768,1024], [1440,900]];
const screens = ['desktop','mlb','nfl','nba','nhl','soccer','sports',
  'live-scores','fantasy','fantasyshop','settings','about','calendar','bankroll'];
const result = document.querySelector('#result');
const run = document.querySelector('#run');
const tick = () => new Promise(resolve => setTimeout(resolve, 80));
function assert(value, message) { if (!value) throw new Error(message); }
function near(actual, expected, message) {
  assert(Math.abs(actual - expected) <= 1, `${message}: ${actual} vs ${expected}`);
}
run.addEventListener('click', async () => {
  run.disabled = true;
  const failures = [];
  let passed = 0;
  let frame;
  try {
    for (const entry of ['index.html','parlayos.html']) {
      frame = document.createElement('iframe');
      frame.title = `${entry} layout preview`;
      frame.width = 1440;
      frame.height = 900;
      const loaded = new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error(`${entry} load timed out`)), 30000);
        frame.onload = () => { clearTimeout(timer); resolve(); };
      });
      // Avoid mixing cached entrypoints from different Pages deployments.
      frame.src = '../' + entry + '?ui-regression=' + Date.now();
      document.querySelector('#preview').replaceChildren(frame);
      await loaded;
      const win = frame.contentWindow, doc = frame.contentDocument;
      assert(win.ParlayOSUI, 'Shared UI did not initialize');
      doc.querySelector('#coverUnlockBtn')?.click();
      // Let the existing cover transition and startup layout callbacks settle.
      await new Promise(resolve => setTimeout(resolve, 1000));
      for (const [width,height] of sizes) {
        frame.width = width;
        frame.height = height;
        await tick();
        const gutter = width <= 760 ? 16 : 24;
        for (const theme of ['original','winter']) {
          const savedClass = doc.body.className;
          doc.body.className = savedClass.replace(/\btheme-\S+/g, '') + ' theme-' + theme;
          for (const name of screens) {
            const label = `${entry} ${width}×${height} ${theme} ${name}`;
            try {
              assert(win.ParlayOSUI.navigate(name), 'Screen navigation failed');
              await tick();
              const screen = doc.getElementById('screen-' + name);
              const viewport = doc.querySelector('#viewport');
              const css = win.getComputedStyle(screen);
              const box = screen.getBoundingClientRect();
              assert(doc.querySelectorAll('.screen.active').length === 1, 'Multiple active screens');
              near(parseFloat(css.paddingTop), gutter, 'Top gutter');
              near(parseFloat(css.paddingLeft), gutter, 'Left gutter');
              near(parseFloat(css.paddingRight), gutter, 'Right gutter');
              assert(css.minHeight === '0px' && css.maxHeight === 'none', 'Legacy viewport-height constraint');
              assert(css.overflowY === 'visible', 'Screen creates a second scroll container');
              near(box.width, Math.min(1248, viewport.clientWidth), 'Shared frame width');
              near(parseFloat(css.marginLeft), parseFloat(css.marginRight), 'Centered frame');
              screen.scrollTop = 100;
              near(screen.scrollTop, 0, 'Screen should not scroll independently');
              const titlebar = doc.querySelector('.titlebar');
              const titleTop = titlebar.getBoundingClientRect().top;
              viewport.scrollTop = viewport.scrollHeight;
              if (viewport.scrollHeight > viewport.clientHeight + 1)
                assert(viewport.scrollTop > 0, 'Long content cannot scroll');
              near(titlebar.getBoundingClientRect().top, titleTop, 'Titlebar moves with content');
              viewport.scrollTop = 0;
              passed++;
            } catch (error) { failures.push(`${label}: ${error.message}`); }
            result.textContent = `Running: ${passed} passed, ${failures.length} failed.\n${label}`;
          }
          doc.body.className = savedClass;
        }
      }
      frame.remove();
    }
  } catch (error) { failures.push(error.message); }
  finally {
    frame?.remove();
    result.textContent = `${failures.length ? 'FAIL' : 'PASS'}: ${passed} passed, ${failures.length} failed.\n` + failures.join('\n');
    result.dataset.complete = 'true';
    result.dataset.failures = String(failures.length);
    run.disabled = false;
  }
});

// This focused regression measures real text/arrow boxes, including larger text.
document.querySelector('#menu-run').addEventListener('click', async () => {
  const button = document.querySelector('#menu-run'), output = document.querySelector('#menu-result');
  button.disabled = true; run.disabled = true;
  let frame, passed = 0; const failures = [];
  output.textContent = 'Checking mobile menu…';
  try {
    for (const entry of ['index.html', 'parlayos.html']) {
      frame = document.createElement('iframe'); frame.title = entry + ' mobile menu preview';
      frame.width = 393; frame.height = 852;
      const loaded = new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(Error('Page load timed out')), 30000);
        frame.onload = () => { clearTimeout(timer); resolve(); };
      });
      frame.src = '../' + entry + '?menu-regression=' + Date.now();
      document.querySelector('#preview').replaceChildren(frame); await loaded;
      const doc = frame.contentDocument, win = frame.contentWindow;
      doc.querySelector('#coverUnlockBtn')?.click(); doc.querySelector('#coverSkipBtn')?.click();
      await new Promise(resolve => setTimeout(resolve, 1800));
      for (const width of [320,375,390,393,430,480,768,1440]) {
        frame.width = width; await tick();
        for (const large of [false,true]) {
          const style = doc.createElement('style');
          if (large) style.textContent = 'html body.pos-ui #menuGrid .menu-btn h3 {font-size:40px!important} html body.pos-ui #menuGrid .menu-btn p {font-size:28px!important}';
          doc.head.appendChild(style); await tick();
          const label = `${entry} ${width}px ${large ? '200% text' : 'normal text'}`;
          try {
            const cards = [...doc.querySelectorAll('#menuGrid .menu-btn')].filter(el => el.getClientRects().length);
            assert(cards.length === 6, 'Expected six visible menu buttons');
            assert(cards[0].dataset.go === 'sports', 'Sports Hub must lead');
            for (let i = 0; i < cards.length; i++) {
              const card = cards[i], box = card.getBoundingClientRect();
              const heading = card.querySelector('h3').getBoundingClientRect();
              const description = card.querySelector('p').getBoundingClientRect();
              const arrow = card.querySelector('.go').getBoundingClientRect();
              assert(description.top >= heading.bottom - 1, card.dataset.go + ': title overlaps description');
              assert(arrow.top >= description.bottom + 8, card.dataset.go + ': arrow overlaps description');
              assert(arrow.bottom <= box.bottom - 8, card.dataset.go + ': arrow escapes card');
              assert(card.scrollWidth <= card.clientWidth + 1, card.dataset.go + ': content overflows');
              for (const other of cards.slice(i + 1)) {
                const b = other.getBoundingClientRect();
                assert(box.right <= b.left + 1 || box.left >= b.right - 1 || box.bottom <= b.top + 1 || box.top >= b.bottom - 1, 'Menu buttons overlap');
              }
            }
            assert(doc.documentElement.scrollWidth <= win.innerWidth + 1, 'Page overflows horizontally');
            passed++;
          } catch (error) { failures.push(label + ': ' + error.message); }
          style.remove();
          output.textContent = `Running: ${passed} passed, ${failures.length} failed.\n${label}`;
        }
      }
      frame.remove(); frame = null;
    }
  } catch (error) { failures.push(error.message); }
  finally {
    frame?.remove(); button.disabled = false; run.disabled = false;
    output.textContent = `${failures.length ? 'FAIL' : 'PASS'}: ${passed} menu cases, ${failures.length} failures.\n` + failures.join('\n');
  }
});
</script>
</html>
